<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>स्मार्ट कैलकुलेटर - Smart Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;

      /* टेक्स्ट सिलेक्शन और कॉपी रोकने के नियम */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
    }

    /* App Header */
    .header {
      background: #0284c7;
      padding: 16px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #fff;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 6px;
      border: none;
      background: none;
      color: #64748b;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active {
      color: #0284c7;
      border-bottom: 3px solid #0284c7;
      background: #ffffff;
    }

    .content-section {
      display: none;
      padding: 16px;
    }

    .content-section.active {
      display: block;
    }

    /* Standard Calculator Screen */
    .display {
      background: #f8fafc;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: right;
      border: 1px solid #e2e8f0;
    }

    .display-history {
      font-size: 0.85rem;
      color: #64748b;
      min-height: 20px;
      word-break: break-all;
    }

    .display-main {
      font-size: 2rem;
      font-weight: bold;
      color: #0f172a;
      word-break: break-all;
      margin-top: 4px;
    }

    /* Keypad Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn {
      padding: 14px;
      font-size: 1.25rem;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: #f1f5f9;
      color: #334155;
      transition: 0.1s;
    }

    .btn:active {
      transform: scale(0.95);
      background: #e2e8f0;
    }

    .btn-op {
      background: #fef3c7;
      color: #d97706;
    }
    .btn-op:active { background: #fde68a; }

    .btn-action {
      background: #fee2e2;
      color: #dc2626;
    }
    .btn-action:active { background: #fecaca; }

    .btn-equal {
      background: #10b981;
      color: #fff;
      grid-column: span 2;
    }
    .btn-equal:active { background: #059669; }

    /* History List */
    .history-drawer {
      margin-top: 14px;
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px;
      max-height: 120px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #0284c7;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .history-item {
      font-size: 0.85rem;
      padding: 4px 0;
      border-bottom: 1px solid #e2e8f0;
      color: #475569;
    }

    .clear-btn {
      color: #dc2626;
      background: none;
      border: none;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Forms for Age & Interest */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #475569;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #1e293b;
      font-size: 1rem;
      outline: none;

      /* इनपुट फील्ड में यूजर को टाइप और कर्सर मूव करने की अनुमति */
      -webkit-user-select: auto;
      -moz-user-select: auto;
      -ms-user-select: auto;
      user-select: auto;
    }

    .calc-btn {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 6px;
    }
    .calc-btn:active { background: #0369a1; }

    .result-box {
      margin-top: 14px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      font-size: 0.9rem;
      line-height: 1.6;
      display: none;
      color: #334155;
    }

    .result-box strong {
      color: #0284c7;
    }
  </style>
</head>
<body oncontextmenu="return false;" oncopy="return false;" oncut="return false;">

  <div class="app-card">
    <div class="header">स्मार्ट कैलकुलेटर</div>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('calc')">कैलकुलेटर</button>
      <button class="tab-btn" onclick="switchTab('age')">आयु कैलकुलेटर</button>
      <button class="tab-btn" onclick="switchTab('interest')">ब्याज कैलकुलेटर</button>
    </div>

    <!-- 1. Standard Calculator Tab -->
    <div id="calc-tab" class="content-section active">
      <div class="display">
        <div class="display-history" id="calcExp"></div>
        <div class="display-main" id="calcDisplay">0</div>
      </div>

      <div class="grid">
        <button class="btn btn-action" onclick="clearCalc()">AC</button>
        <button class="btn btn-action" onclick="deleteLast()">⌫</button>
        <button class="btn btn-op" onclick="appendOp('%')">%</button>
        <button class="btn btn-op" onclick="appendOp('/')">÷</button>

        <button class="btn" onclick="appendNum('7')">7</button>
        <button class="btn" onclick="appendNum('8')">8</button>
        <button class="btn" onclick="appendNum('9')">9</button>
        <button class="btn btn-op" onclick="appendOp('*')">×</button>

        <button class="btn" onclick="appendNum('4')">4</button>
        <button class="btn" onclick="appendNum('5')">5</button>
        <button class="btn" onclick="appendNum('6')">6</button>
        <button class="btn btn-op" onclick="appendOp('-')">−</button>

        <button class="btn" onclick="appendNum('1')">1</button>
        <button class="btn" onclick="appendNum('2')">2</button>
        <button class="btn" onclick="appendNum('3')">3</button>
        <button class="btn btn-op" onclick="appendOp('+')">+</button>

        <button class="btn" onclick="appendNum('0')">0</button>
        <button class="btn" onclick="appendNum('.')">.</button>
        <button class="btn btn-equal" onclick="computeResult()">=</button>
      </div>

      <!-- History Section -->
      <div class="history-drawer">
        <div class="history-header">
          <span>गणना इतिहास (History)</span>
          <button class="clear-btn" onclick="clearHistory()">मिटाएं</button>
        </div>
        <div id="historyList">
          <div style="color: #94a3b8; font-size: 0.8rem;">कोई पुराना हिसाब नहीं है।</div>
        </div>
      </div>
    </div>

    <!-- 2. Age Calculator Tab -->
    <div id="age-tab" class="content-section">
      <div class="form-group">
        <label>जन्म तिथि (Date of Birth):</label>
        <input type="date" id="birthDate" />
      </div>
      <div class="form-group">
        <label>इस तारीख तक आयु निकालें:</label>
        <input type="date" id="targetDate" />
      </div>
      <button class="calc-btn" onclick="calculateAge()">आयु की गणना करें</button>

      <div class="result-box" id="ageResult"></div>
    </div>

    <!-- 3. Interest Calculator Tab -->
    <div id="interest-tab" class="content-section">
      <div class="form-group">
        <label>मूलधन (रुपये में):</label>
        <input type="number" id="intPrincipal" placeholder="उदा. 50000" />
      </div>
      <div class="form-group">
        <label>ब्याज दर (% प्रति माह या ₹ सैकड़ा):</label>
        <input type="number" step="0.1" id="intRate" placeholder="उदा. 2% मासिक" />
      </div>
      <div class="form-group">
        <label>समय - महीने (Months):</label>
        <input type="number" id="intMonths" placeholder="उदा. 12" />
      </div>
      <div class="form-group">
        <label>समय - अतिरिक्त दिन (Days):</label>
        <input type="number" id="intDays" placeholder="उदा. 15" />
      </div>
      <button class="calc-btn" onclick="calculateSimpleInterest()">ब्याज निकालें</button>

      <div class="result-box" id="intResult"></div>
    </div>
  </div>

  <script>
    // आज की तारीख डिफ़ॉल्ट रूप से सेट करना Age Calculator के लिए
    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      const targetDateInput = document.getElementById('targetDate');
      if(targetDateInput) targetDateInput.value = today;
    });

    // सिलेक्शन, कॉपी और ड्रैग रोकने के इवेंट लिसनर
    document.addEventListener('selectstart', function(e) {
      if (e.target.tagName !== 'INPUT') {
        e.preventDefault();
      }
    });

    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
    });

    // Tab switching
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));

      if (tabName === 'calc') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('calc-tab').classList.add('active');
      } else if (tabName === 'age') {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('age-tab').classList.add('active');
      } else {
        document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
        document.getElementById('interest-tab').classList.add('active');
      }
    }

    // Calculator Logic
    let currentInput = '0';
    let currentExp = '';
    let history = JSON.parse(localStorage.getItem('smart_calc_hist') || '[]');

    function updateDisplay() {
      document.getElementById('calcDisplay').innerText = currentInput;
      document.getElementById('calcExp').innerText = currentExp;
    }

    function appendNum(num) {
      if (currentInput === '0' && num !== '.') {
        currentInput = num;
      } else if (num === '.' && currentInput.includes('.')) {
        return;
      } else {
        currentInput += num;
      }
      updateDisplay();
    }

    function appendOp(op) {
      if (currentInput !== '') {
        currentExp += ' ' + currentInput + ' ' + op;
        currentInput = '0';
        updateDisplay();
      }
    }

    function clearCalc() {
      currentInput = '0';
      currentExp = '';
      updateDisplay();
    }

    function deleteLast() {
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = '0';
      }
      updateDisplay();
    }

    function computeResult() {
      if (!currentExp && currentInput === '0') return;
      let fullExpression = currentExp + ' ' + currentInput;
      try {
        let cleanExp = fullExpression.replace(/÷/g, '/').replace(/×/g, '*');
        let res = Function('"use strict"; return (' + cleanExp + ')')();
        res = Math.round(res * 1000000) / 1000000;

        addHistory(fullExpression + ' = ' + res);
        currentInput = res.toString();
        currentExp = '';
        updateDisplay();
      } catch (e) {
        currentInput = 'Error';
        updateDisplay();
      }
    }

    function addHistory(record) {
      history.unshift(record);
      if (history.length > 15) history.pop();
      localStorage.setItem('smart_calc_hist', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      if (history.length === 0) {
        container.innerHTML = '<div style="color: #94a3b8; font-size: 0.8rem;">कोई पुराना हिसाब नहीं है।</div>';
        return;
      }
      container.innerHTML = history.map(item => `<div class="history-item">${item}</div>`).join('');
    }

    function clearHistory() {
      history = [];
      localStorage.removeItem('smart_calc_hist');
      renderHistory();
    }
    renderHistory();

    // Age Calculator Logic
    function calculateAge() {
      const birthVal = document.getElementById('birthDate').value;
      const targetVal = document.getElementById('targetDate').value;
      const resultBox = document.getElementById('ageResult');

      if (!birthVal || !targetVal) {
        alert("कृपया जन्म तिथि और लक्ष्य तिथि दोनों चुनें।");
        return;
      }

      const birthDate = new Date(birthVal);
      const targetDate = new Date(targetVal);

      if (birthDate > targetDate) {
        alert("जन्म तिथि, लक्ष्य तिथि से बाद की नहीं हो सकती।");
        return;
      }

      let years = targetDate.getFullYear() - birthDate.getFullYear();
      let months = targetDate.getMonth() - birthDate.getMonth();
      let days = targetDate.getDate() - birthDate.getDate();

      if (days < 0) {
        months--;
        const prevMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0);
        days += prevMonth.getDate();
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      const diffTime = Math.abs(targetDate - birthDate);
      const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const totalMonths = (years * 12) + months;
      const totalWeeks = Math.floor(totalDays / 7);

      resultBox.style.display = 'block';
      resultBox.innerHTML = `
        <div>सटीक आयु: <strong>${years} वर्ष, ${months} महीने, ${days} दिन</strong></div>
        <hr style="border:0; border-top:1px solid #e2e8f0; margin: 8px 0;">
        <div>कुल महीने: <strong>${totalMonths.toLocaleString('en-IN')}</strong></div>
        <div>कुल सप्ताह: <strong>${totalWeeks.toLocaleString('en-IN')}</strong></div>
        <div>कुल दिन: <strong>${totalDays.toLocaleString('en-IN')}</strong></div>
      `;
    }

    // Monthly & Daily Interest Calculator
    function calculateSimpleInterest() {
      const P = parseFloat(document.getElementById('intPrincipal').value) || 0;
      const monthlyRate = parseFloat(document.getElementById('intRate').value) || 0;
      const months = parseFloat(document.getElementById('intMonths').value) || 0;
      const days = parseFloat(document.getElementById('intDays').value) || 0;
      const resultBox = document.getElementById('intResult');

      if (P <= 0 || monthlyRate <= 0 || (months === 0 && days === 0)) {
        alert("कृपया मूलधन, ब्याज दर और सही समय (महीने या दिन) दर्ज करें।");
        return;
      }

      // महीने का ब्याज + दिनों का ब्याज (एक महीने को 30 दिन मानकर)
      const interestFromMonths = (P * monthlyRate * months) / 100;
      const dailyRate = monthlyRate / 30; 
      const interestFromDays = (P * dailyRate * days) / 100;

      const totalInterest = interestFromMonths + interestFromDays;
      const totalAmount = P + totalInterest;

      resultBox.style.display = 'block';
      resultBox.innerHTML = `
        <div>महीनों का ब्याज: <strong>₹${Math.round(interestFromMonths).toLocaleString('en-IN')}</strong></div>
        <div>दिनों का ब्याज: <strong>₹${Math.round(interestFromDays).toLocaleString('en-IN')}</strong></div>
        <hr style="border:0; border-top:1px solid #e2e8f0; margin: 8px 0;">
        <div>कुल ब्याज: <strong>₹${Math.round(totalInterest).toLocaleString('en-IN')}</strong></div>
        <div>कुल वापस देने योग्य राशि: <strong>₹${Math.round(totalAmount).toLocaleString('en-IN')}</strong></div>
      `;
    }
  </script>
</body>
</html>
